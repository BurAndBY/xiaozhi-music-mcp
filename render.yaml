services:
  - type: web
    name: xiaozhi-music-mcp
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 music_mcp_websocket_server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: YANDEX_MUSIC_TOKEN
        sync: false
    autoDeploy: false
